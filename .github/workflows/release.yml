# Builds abi3 wheels (CPython 3.9+) and free-threaded wheels (3.14t, 3.15t) for every supported
# platform plus an sdist, install-tests them on each Python version,
# and publishes to PyPI (trusted publishing) when a v* tag is pushed.
name: Build, test and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release

  # One abi3 wheel per platform covers CPython 3.9+.
  wheels:
    name: wheel ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, os: ubuntu-24.04, target: x86_64, manylinux: '2014' }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: '2014' }
          - { name: musllinux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64 }
          - { name: macos-arm64, os: macos-15, target: aarch64 }
          - { name: windows-x86_64, os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.name }}
          path: dist

  # Free-threaded CPython (3.14t, 3.15t) can't load abi3 wheels, so these are version-specific.
  # Linux uses manylinux_2_28 because that's what numpy's free-threaded wheels need anyway.
  wheels-ft:
    name: wheel ${{ matrix.name }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14t', '3.15t']
        name: [manylinux-x86_64, manylinux-aarch64, macos-x86_64, macos-arm64, windows-x86_64]
        include:
          - { name: manylinux-x86_64, os: ubuntu-24.04, target: x86_64, manylinux: '2_28' }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: '2_28' }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64 }
          - { name: macos-arm64, os: macos-15, target: aarch64 }
          - { name: windows-x86_64, os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: py
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # Inside the manylinux container the interpreters are on PATH as python3.14t etc.
          args: --release --out dist -i ${{ startsWith(matrix.os, 'ubuntu') && format('python{0}', matrix.python) || steps.py.outputs.python-path }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-ft-${{ matrix.name }}-${{ matrix.python }}
          path: dist

  test-wheels-ft:
    name: test ${{ matrix.name }} py${{ matrix.python }}
    needs: wheels-ft
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14t', '3.15t']
        name: [manylinux-x86_64, manylinux-aarch64, macos-x86_64, macos-arm64, windows-x86_64]
        include:
          - { name: manylinux-x86_64, os: ubuntu-24.04 }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: wheel-ft-${{ matrix.name }}-${{ matrix.python }}
          path: dist
      - run: python -m pip install numpy pytest
      - run: python -m pip install --no-index --find-links dist npids
      # Importing a module that doesn't declare free-threading support re-enables the GIL with a
      # RuntimeWarning; treat that as a failure and check the GIL is still off afterwards.
      - shell: bash
        run: |
          python -W error::RuntimeWarning -c "import npids, sys; print(npids.__version__, npids.__file__, sys.version); assert not sys._is_gil_enabled()"
          cp -r test "$RUNNER_TEMP/test"
          cd "$RUNNER_TEMP"
          python -W error::RuntimeWarning -m pytest -q test

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist

  test-wheels:
    name: test ${{ matrix.wheel }} py${{ matrix.python }}
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        wheel: [manylinux-x86_64, manylinux-aarch64, macos-x86_64, macos-arm64, windows-x86_64]
        include:
          - { wheel: manylinux-x86_64, os: ubuntu-24.04 }
          - { wheel: manylinux-aarch64, os: ubuntu-24.04-arm }
          - { wheel: macos-x86_64, os: macos-15-intel }
          - { wheel: macos-arm64, os: macos-15 }
          - { wheel: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist
      - run: python -m pip install numpy pytest
      - run: python -m pip install --no-index --find-links dist npids
      # Run from a temp dir copy so the tests import the installed wheel, not the source tree.
      - shell: bash
        run: |
          python -c "import npids, sys; print(npids.__version__, npids.__file__, sys.version)"
          cp -r test "$RUNNER_TEMP/test"
          cd "$RUNNER_TEMP"
          python -m pytest -q test

  test-musllinux:
    name: test musllinux-x86_64 py${{ matrix.python }}
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ubuntu-24.04
    container: python:${{ matrix.python }}-alpine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: wheel-musllinux-x86_64
          path: dist
      - run: 'python -m pip install --only-binary=:all: numpy pytest'
      - run: python -m pip install --no-index --find-links dist npids
      - run: |
          python -c "import npids, sys; print(npids.__version__, npids.__file__, sys.version)"
          cp -r test /tmp/test
          cd /tmp
          python -m pytest -q test

  test-sdist:
    needs: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist
      - run: python -m pip install numpy pytest
      - run: python -m pip install dist/*.tar.gz
      - run: |
          cp -r test "$RUNNER_TEMP/test"
          cd "$RUNNER_TEMP"
          python -m pytest -q test

  publish:
    needs: [cargo-test, test-wheels, test-wheels-ft, test-musllinux, test-sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/npids/${{ steps.version.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - id: version
        shell: bash
        run: |
          ls -l dist
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The tag must match the version the packages were built with.
          ls dist/npids-"$version".tar.gz
          test "$(ls dist/*abi3*.whl | wc -l)" -eq 6
          test "$(ls dist/*cp31?t*.whl | wc -l)" -eq 10
      - uses: pypa/gh-action-pypi-publish@release/v1
