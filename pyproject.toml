[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "npids"
description = "Time- and space-efficient bi-directional lookups for identifiers"
readme = "README.md"
license = { text = "MPL-2.0" }
authors = [{ name = "Sean MacAvaney", email = "sean.macavaney@glasgow.ac.uk" }]
requires-python = ">=3.9"
dependencies = ["numpy"]
dynamic = ["version"]
keywords = ["identifiers", "lookup", "mmap", "information retrieval"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/seanmacavaney/npids"
Repository = "https://github.com/seanmacavaney/npids"
Issues = "https://github.com/seanmacavaney/npids/issues"
Changelog = "https://github.com/seanmacavaney/npids/releases"

[tool.maturin]
python-source = "python"
module-name = "npids._npids"
features = ["python"]
