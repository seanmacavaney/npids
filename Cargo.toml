[package]
name = "npids"
version = "1.0.1"
edition = "2024"
description = "Time- and space-efficient bi-directional lookups for identifiers"
license = "MPL-2.0"
repository = "https://github.com/seanmacavaney/npids"
readme = "README.md"
exclude = ["/test/samples", "/bench", "/.github"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32c = "0.6.9"
memmap2 = "0.9.12"
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py39"] }
numpy = { version = "0.30.0", optional = true }

[features]
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
